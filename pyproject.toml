[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notify-dispatch"
version = "0.1.0"
description = "Template-driven notifications across SMS, push and email: one dispatch API, provider adapters, background delivery."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["notifications", "sms", "push", "email", "templates"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shipmindlabs/notify-dispatch"
Source = "https://github.com/shipmindlabs/notify-dispatch"
Issues = "https://github.com/shipmindlabs/notify-dispatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/notify_dispatch"]
